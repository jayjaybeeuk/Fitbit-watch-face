name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  icon:
    name: App icon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # No npm ci needed: the check has no dependencies.
      - name: Verify resources/icon.png
        run: npm run check:icon

  bundle:
    name: Packaged icon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Skip install scripts: keytar's native build is only needed by the
      # interactive login CLI, not by fitbit-build.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify icon inside build/app.fba
        run: npm run check:fba-icon
